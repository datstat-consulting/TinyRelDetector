# pyproject.toml

[project]
name = "tiny-rel-detector"
version = "0.2.0"
description = "Relational visual learner in tinygrad with a Wasserstein detection head and YOLO-format loader."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tinygrad>=0.11,<0.12",
    "numpy",
    "pillow>=9.1",
    "safetensors>=0.4",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["TinyRelDetector*"]
[project.optional-dependencies]
vision = ["ultralytics>=8.1", "lap>=0.5.12", "onnx>=1.14"]
benchmark = ["ultralytics>=8.1", "lap>=0.5.12", "pycocotools>=2.0.7", "trackeval>=1.3"]

[project.scripts]
tinyrel = "TinyRelDetector.cli:main"
